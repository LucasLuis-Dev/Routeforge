services:
  postgres:
    image: postgres:16-alpine
    container_name: routeforge-postgres
    restart: always
    environment:
      POSTGRES_USER: routeforge_user
      POSTGRES_PASSWORD: routeforge_password
      POSTGRES_DB: routeforge_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeforge_user -d routeforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: routeforge-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: routeforge-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: routeforge_user
      RABBITMQ_DEFAULT_PASS: routeforge_password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: routeforge-ml-service
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      - PORT=8000
      - GRPC_PORT=50051
    restart: unless-stopped

  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: routeforge-backend-go
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=routeforge_user
      - DB_PASSWORD=routeforge_password
      - DB_NAME=routeforge_db
      - DB_SSLMODE=disable
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_GRPC_URL=ml-service:50051
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://routeforge_user:routeforge_password@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ml-service:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
